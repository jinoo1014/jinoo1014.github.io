<!DOCTYPE html>
<!--
  빠른 세무 상담 신청 — 전용 경량 페이지 (블로그·외부 링크용)
  배포: 저장소에 consult.html 로 올리면 주소는  도메인/consult.html
        (블로그 글 하단에 이 주소를 링크. ?from=blog 를 붙이면 시트에 유입경로 기록됨
         예: https://도메인/consult.html?from=blog)
  백엔드: 랜딩과 동일한 Apps Script ENDPOINT 재사용 → 카톡 알림·시트 누적 동일
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>빠른 세무 상담 신청 | 이안세무회계컨설팅</title>
<meta name="description" content="궁금하신 세무 사항을 남겨주시면 세무사가 직접 확인하고 빠르게 답변드립니다. 첫 상담 무료.">
<meta name="robots" content="noindex">  <!-- 검색 색인은 랜딩으로 모으고 이 페이지는 제외 -->
<meta name="theme-color" content="#f7f6f3">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#f7f6f3; --ink:#2b2417; --mute:#7d7263; --hairline:#e7e3da;
  --teal:#009c85; --blue:#1099d5; --kakao:#fee500; --kakao-ink:#191600;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif;
  font-size:16px; line-height:1.7; word-break:keep-all; overflow-wrap:break-word;
  min-height:100svh; display:flex; flex-direction:column; align-items:center;
  padding:28px 16px 48px;
}
a{color:inherit; text-decoration:none}
.nw{white-space:nowrap}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px; border-radius:4px}

.top{display:flex; align-items:center; justify-content:center; margin-bottom:22px}
.top img{height:34px; width:auto}

.card{
  width:100%; max-width:640px; background:#fff; border:1px solid var(--hairline);
  border-radius:20px; padding:34px 30px;
  box-shadow:0 40px 100px -20px rgba(43,36,23,.14);
}
h1{font-size:20px; font-weight:800; letter-spacing:-.02em; margin:0 0 6px; display:flex; align-items:center; gap:8px}
.sub{font-size:13.5px; color:var(--mute); margin:0 0 24px}
.f-row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.fg{margin-bottom:14px}
.fg label{display:block; font-size:12px; font-weight:800; color:#6d6350; margin-bottom:6px}
.fg label .req{color:#d64545}
.fg input,.fg select,.fg textarea{
  width:100%; border:1.5px solid var(--hairline); border-radius:11px; background:#fbfaf7;
  padding:12px 14px; font-size:15px; font-family:inherit; color:var(--ink);
  transition:border-color .2s, background .2s; outline:none;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--teal); background:#fff}
.fg textarea{resize:vertical; min-height:110px}
.agree{display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color:var(--mute); line-height:1.6; margin:4px 0 18px}
.agree input{width:16px; height:16px; margin-top:2px; accent-color:var(--teal); flex:0 0 16px}
.submit{
  width:100%; min-height:54px; border:0; border-radius:13px; cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--teal)); color:#fff;
  font-size:16px; font-weight:800; font-family:inherit;
  transition:transform .25s var(--ease), opacity .2s;
}
.submit:hover{transform:translateY(-2px)}
.submit:active{transform:scale(.96); transition-duration:.12s}
@media (hover:none){ .submit:hover{transform:none} .alt a:hover{transform:none} }
.submit:disabled{opacity:.55; cursor:wait; transform:none}
.note{margin-top:12px; font-size:12px; color:#a99e86; text-align:center}
.status{display:none; margin-top:14px; border-radius:11px; padding:13px 16px; font-size:13.5px; line-height:1.6}
.status.ok{display:block; background:#e9f7f1; color:#0b6e52; border:1px solid #bfe7d6}
.status.err{display:block; background:#fdeeee; color:#a13333; border:1px solid #f2cfcf}
.done{display:none; text-align:center; padding:36px 6px}
.done.show{display:block}
.done .ic{width:56px; height:56px; margin:0 auto 18px; border-radius:50%; display:grid; place-items:center;
  background:linear-gradient(135deg,var(--blue),var(--teal)); color:#fff; font-size:24px}
.done h2{font-size:19px; font-weight:800; margin:0 0 8px}
.done p{font-size:13.5px; color:var(--mute); line-height:1.8; margin:0}
.alt{
  width:100%; max-width:640px; margin-top:16px; display:flex; gap:10px;
}
.alt a{
  flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; border-radius:13px; font-size:14.5px; font-weight:700;
  transition:transform .2s;
}
.alt a:hover{transform:translateY(-2px)}
.alt .kk{background:var(--kakao); color:var(--kakao-ink)}
.alt .tel{background:#fff; border:1.5px solid var(--hairline); color:var(--ink)}
.foot{margin-top:22px; font-size:12px; color:#a99e86; text-align:center; line-height:1.8}
.foot a{color:var(--teal); font-weight:700}
@media (max-width:560px){
  .card{padding:26px 20px}
  .f-row{grid-template-columns:1fr}
  .alt{flex-direction:column}
}

/* 모션 폴리시 (260825) */
h1,h2{text-wrap:balance}
.status.ok,.status.err{animation:statusIn .22s var(--ease)}
@keyframes statusIn{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}
.done.show{animation:doneIn .4s var(--ease)}
.done.show .ic{animation:icPop .45s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes doneIn{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
@keyframes icPop{from{transform:scale(.6); opacity:0}to{transform:scale(1); opacity:1}}
@media (prefers-reduced-motion:reduce){.done.show,.done.show .ic,.status.ok,.status.err{animation:none}}
</style>
</head>

<form class="card" id="consultForm" novalidate>
  <div id="fBody">
    <h1><span aria-hidden="true">🎧</span> 빠른 세무 상담 신청</h1>
    <p class="sub">궁금하신 세무 관련 사항을 남겨주시면 <span class="nw">세무사가 직접 확인하고</span> <span class="nw">빠르게 답변드립니다.</span></p>

    <div class="f-row">
      <div class="fg">
        <label for="fName">성함/상호 <span class="req">*</span></label>
        <input id="fName" type="text" required autocomplete="name" placeholder="성함 또는 상호명">
      </div>
      <div class="fg">
        <label for="fTel">연락처 <span class="req">*</span></label>
        <input id="fTel" type="tel" required autocomplete="tel" inputmode="tel" placeholder="010-0000-0000">
      </div>
    </div>

    <div class="f-row">
      <div class="fg">
        <label for="fCat">상담 카테고리</label>
        <select id="fCat">
              <option>개인사업자</option>
              <option>법인사업자</option>
              <option>종교단체</option>
              <option>일반개인 및 기타</option>
            </select>
      </div>
      <div class="fg">
        <label for="fSvc">원하시는 서비스</label>
        <select id="fSvc">
              <option>세무기장</option>
              <option>세무상담자문</option>
              <option>양도상속증여</option>
              <option>기타</option>
            </select>
      </div>
    </div>

    <div class="fg">
      <label for="fMsg">문의 내용 <span class="req">*</span></label>
      <textarea id="fMsg" required placeholder="상담받고 싶으신 내용을 적어주세요."></textarea>
    </div>

    <label class="agree">
      <input type="checkbox" id="fAgree" required>
      <span>개인정보 수집·이용에 동의합니다. 수집 항목(성함/상호, 연락처, 문의 내용)은 상담 목적으로만 사용하며, 상담 종료 후 파기 요청 시 즉시 삭제합니다. <span class="req">*</span></span>
    </label>

<script>
(function(){
  /* 랜딩과 동일한 Apps Script 웹앱 URL을 넣으면 실전송 (비우면 데모 모드) */
  var ENDPOINT='https://script.google.com/macros/s/AKfycbwhJ0_zkLlm6x1lAAMwRGfyG8xTDL7d85YXqgvM2m0tDi_UyBREH3-j8vpuzpCleJpd/exec';

  /* 유입 경로: ?from=blog 등 파라미터 or 리퍼러가 시트 '유입페이지' 열에 기록됨 */
  var src = new URLSearchParams(location.search).get('from') || '';
  var pageInfo = location.href + (src ? '' : (document.referrer ? ' (ref: ' + document.referrer + ')' : ''));

  var form=document.getElementById('consultForm');
  /* 연락처 자동 하이픈 (휴대폰 3-4-4, 서울 02-, 지역번호 3자리 대응) */
  var telEl=document.getElementById('fTel');
  if(telEl){
    telEl.addEventListener('input', function(){
      var v=telEl.value.replace(/\D/g,'').slice(0,11), o;
      if(v.indexOf('02')===0){
        if(v.length<3) o=v;
        else if(v.length<6) o=v.slice(0,2)+'-'+v.slice(2);
        else if(v.length<10) o=v.slice(0,2)+'-'+v.slice(2,5)+'-'+v.slice(5);
        else o=v.slice(0,2)+'-'+v.slice(2,6)+'-'+v.slice(6,10);
      }else{
        if(v.length<4) o=v;
        else if(v.length<7) o=v.slice(0,3)+'-'+v.slice(3);
        else if(v.length<11) o=v.slice(0,3)+'-'+v.slice(3,6)+'-'+v.slice(6);
        else o=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7);
      }
      telEl.value=o;
    });
  }

  var btn=document.getElementById('fBtn'), st=document.getElementById('fStatus');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    st.className='status'; st.textContent='';
    if(!form.reportValidity()) return;
    if(!document.getElementById('fAgree').checked){
      st.className='status err'; st.textContent='개인정보 수집·이용 동의에 체크해 주세요.'; return;
    }
    var data=new URLSearchParams({
      name: document.getElementById('fName').value.trim(),
      tel: document.getElementById('fTel').value.trim(),
      category: document.getElementById('fCat').value,
      service: document.getElementById('fSvc').value,
      message: document.getElementById('fMsg').value.trim(),
      page: pageInfo
    });
    btn.disabled=true; btn.textContent='전송 중…';
    function done(){ document.getElementById('fBody').style.display='none'; document.getElementById('fDone').classList.add('show'); }
    function fail(){
      btn.disabled=false; btn.textContent='상담 신청하기';
      st.className='status err';
      st.innerHTML='전송에 실패했습니다. 잠시 후 다시 시도하시거나 <a href="http://pf.kakao.com/_JxjCrxb" target="_blank" rel="noopener" style="font-weight:800; text-decoration:underline">카카오톡</a>·전화(02-715-3535)로 문의해 주세요.';
    }
    if(!ENDPOINT){ setTimeout(done, 600); return; }
    fetch(ENDPOINT,{method:'POST', body:data})
      .then(function(r){return r.json()})
      .then(function(j){ j && j.ok ? done() : fail(); })
      .catch(fail);
  });
})();
</script>
